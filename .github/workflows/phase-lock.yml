name: Phase Lock prototype

# Tests and builds prototypes/phase-lock on PRs and main. The Pages deploy of
# the lab (https://<owner>.github.io/<repo>/prototypes/phase-lock/) lives in
# `.github/workflows/pages.yml` so it cannot overwrite the game site.

on:
  pull_request:
    paths:
      ['prototypes/phase-lock/**', 'src/breach/PhaseLock.ts', '.github/workflows/phase-lock.yml']
  push:
    branches: [main]
    paths:
      ['prototypes/phase-lock/**', 'src/breach/PhaseLock.ts', '.github/workflows/phase-lock.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/phase-lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/phase-lock/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
